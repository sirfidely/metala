<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a2530">
<title>Metala</title>
<link rel="stylesheet" href="/vendor/maplibre-gl-4.7.1/maplibre-gl.css">
<link rel="stylesheet" href="/shared/metala.css">
<link rel="stylesheet" href="app.css">
<script src="/vendor/maplibre-gl-4.7.1/maplibre-gl.js"></script>
</head>
<body>
<div class="phone">
  <div class="demo-strip" id="banner">Démo · données fictives</div>

  <section id="login" class="screen login">
    <div class="login-top">
      <div class="mark">M</div>
      <div class="logo">METALA</div>
      <p>Votre ville. Votre mobilité.</p>
    </div>
    <div class="login-form">
      <div id="step-phone">
        <label class="lbl" for="phone">Numéro de téléphone</label>
        <div class="phone-input"><span>+225</span><input id="phone" inputmode="tel" placeholder="07 00 00 00 01" autocomplete="tel"></div>
        <button class="pill-btn primary" id="btn-otp">Continuer</button>
        <button class="pill-btn ghost" id="btn-awa">Compte démo · Awa</button>
      </div>
      <div id="step-code" class="hidden">
        <label class="lbl" for="code">Code reçu par SMS</label>
        <input id="code" class="code-input" inputmode="numeric" maxlength="6" placeholder="••••••" autocomplete="one-time-code">
        <div class="dev-otp hidden" id="dev-otp"></div>
        <button class="pill-btn primary" id="btn-verify">Se connecter</button>
        <button class="pill-btn ghost" id="btn-back">Modifier le numéro</button>
      </div>
    </div>
  </section>

  <section id="main" class="screen hidden">
    <header class="appbar" id="appbar">
      <button class="icon-btn" id="nav-back" aria-label="Retour"></button>
      <div class="appbar-title" id="title"></div>
      <span class="icon-btn" aria-hidden="true"></span>
    </header>
    <div id="view" class="view"></div>
    <div id="mapview" class="mapview hidden">
      <div id="map"></div>
      <div class="map-legend"><span><i class="lg fresh"></i>En direct</span><span><i class="lg delayed"></i>Retardé</span><span><i class="lg unknown"></i>Inconnu</span></div>
      <div id="sheet" class="sheet hidden"></div>
    </div>
    <nav class="tabbar">
      <button data-tab="home" aria-label="Accueil"></button>
      <button data-tab="lines" aria-label="Lignes et arrêts"></button>
      <button data-tab="pass" class="fab" aria-label="Mon Pass"></button>
      <button data-tab="map" aria-label="Carte"></button>
      <button data-tab="profile" aria-label="Profil"></button>
    </nav>
  </section>

  <div id="modal" class="modal hidden"><div class="modal-card" id="modal-card"></div></div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
