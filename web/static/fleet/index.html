<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Metala Gestion</title>
<link rel="stylesheet" href="/vendor/maplibre-gl-4.7.1/maplibre-gl.css">
<link rel="stylesheet" href="/shared/metala.css">
<link rel="stylesheet" href="fleet.css">
<script src="/vendor/maplibre-gl-4.7.1/maplibre-gl.js"></script>
</head>
<body>
<section id="login" class="login-wrap">
  <div class="card login-card">
    <div class="brand"><span class="m">M</span><span>METALA <small>GESTION</small></span></div>
    <div class="seg2"><button data-l="in" class="on">Connexion</button><button data-l="up">Inscrire ma compagnie</button></div>
    <div id="l-in">
      <div class="field"><label for="u">E-mail</label><input id="u" autocomplete="username" placeholder="admin@compagnie.ci"></div>
      <div class="field"><label for="pw">Mot de passe</label><input id="pw" type="password" autocomplete="current-password"></div>
      <button class="btn block" id="btn-login">Se connecter</button>
      <div class="demo-acc" id="demo-acc"></div>
    </div>
    <div id="l-up" class="hidden">
      <div class="field"><label for="r-name">Nom de la compagnie</label><input id="r-name" placeholder="Transports Eburnea"></div>
      <div class="field"><label for="r-kind">Catégorie</label><select id="r-kind"><option value="public">Entreprise publique</option><option value="prive" selected>Compagnie privée</option><option value="artisanal">Transport artisanal (gbaka, woro-woro)</option><option value="taxi">Taxis compteurs</option></select></div>
      <div class="field"><label for="r-mail">E-mail de l’administrateur</label><input id="r-mail" placeholder="direction@compagnie.ci" autocomplete="email"></div>
      <div class="field"><label for="r-pw">Mot de passe</label><input id="r-pw" type="password" placeholder="8 caractères minimum" autocomplete="new-password"></div>
      <button class="btn block" id="btn-register">Créer le compte</button>
      <p class="small muted" style="margin:12px 0 0">Vous pourrez ensuite enregistrer vos lignes, tarifs, véhicules et conducteurs.</p>
    </div>
  </div>
</section>

<section id="app" class="layout hidden">
  <aside>
    <div class="brand light"><span class="m">M</span><span>METALA <small>GESTION</small></span></div>
    <nav id="nav">
      <button data-v="dash">Tableau de bord</button>
      <button data-v="lines">Lignes</button>
      <button data-v="fares">Tarifs</button>
      <button data-v="vehicles">Véhicules</button>
      <button data-v="drivers">Conducteurs</button>
      <button data-v="payments">Paiements</button>
      <button data-v="recon">Recettes</button>
      <button data-v="operators" class="admin-only hidden">Compagnies</button>
      <button data-v="cards" class="admin-only hidden">Cartes Pass</button>
    </nav>
    <div class="who"><div id="who"></div><button class="btn ghost small" id="logout">Se déconnecter</button></div>
  </aside>
  <main>
    <div class="head">
      <h2 id="view-title"></h2>
      <div class="row"><select id="op-filter" class="hidden" aria-label="Compagnie"></select><span class="small muted" id="updated"></span></div>
    </div>
    <div id="view"></div>
  </main>
</section>
<script type="module" src="fleet.js"></script>
</body>
</html>
