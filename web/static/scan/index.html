<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#071a20">
<title>Metala Scan</title>
<link rel="stylesheet" href="/shared/metala.css">
<style>
  :root { --bg: #071a20; --sf: #0f2a33; --sf2: #163742; --bd: rgba(255,255,255,.08); --tx: #e9f3f1; --mu: #86a5a2; --gr: #34d399; --gr2: #10b981; --or: #f5a24b; --rd: #f87171; }
  body { background: #04110f; color: var(--tx); }
  body.embed { background: var(--bg); }
  .term { max-width: 460px; margin: 0 auto; min-height: 100dvh; background: var(--bg); display: flex; flex-direction: column; position: relative; }
  @media (min-width: 600px) { body:not(.embed) { padding: 24px 0; } body:not(.embed) .term { min-height: calc(100dvh - 48px); border-radius: 28px; box-shadow: 0 20px 60px rgba(0,0,0,.5); overflow: hidden; } }
  .strip { font-size: 11px; text-align: center; padding: 4px; background: #2e1065; color: #ddd6fe; }
  .ic { display: block; flex: none; }
  .muted { color: var(--mu); }
  /* Connexion */
  .login { padding: 22px 18px; display: flex; flex-direction: column; gap: 12px; flex: 1; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 900; letter-spacing: .14em; }
  .brand .m { width: 40px; height: 40px; border-radius: 12px; background: linear-gradient(140deg, #34d399, #0e7c66); color: #06231b; display: flex; align-items: center; justify-content: center; font-size: 22px; letter-spacing: 0; }
  h2 { margin: 10px 0 2px; font-size: 22px; }
  .list { display: grid; gap: 8px; }
  .opt { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 16px; border: 1px solid var(--bd); background: var(--sf); color: var(--tx); text-align: left; width: 100%; }
  .opt .av { width: 40px; height: 40px; border-radius: 12px; background: var(--sf2); display: flex; align-items: center; justify-content: center; font-weight: 900; flex: none; color: #fff; }
  .opt small { display: block; color: var(--mu); font-size: 12.5px; margin-top: 2px; }
  .pin-dots { display: flex; gap: 14px; justify-content: center; margin: 18px 0; }
  .pin-dots i { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--mu); }
  .pin-dots i.on { background: var(--gr); border-color: var(--gr); }
  .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .keypad button { height: 62px; border-radius: 18px; border: 0; background: var(--sf); color: var(--tx); font-size: 24px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .keypad button:active { background: var(--sf2); }
  .keypad .ok { background: var(--gr2); color: #04281e; font-size: 17px; }
  .link { background: none; border: 0; color: var(--gr); font-weight: 700; padding: 8px; }
  /* Service */
  .top { display: flex; align-items: center; gap: 12px; padding: 14px 16px 8px; }
  .chipl { min-width: 46px; height: 38px; padding: 0 8px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-weight: 900; color: #fff; gap: 4px; }
  .top .grow { flex: 1; min-width: 0; }
  .top b { display: block; font-size: 16px; }
  .top small { color: var(--mu); font-size: 12.5px; }
  .net { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 800; padding: 7px 11px; border-radius: 999px; background: var(--sf); color: var(--gr); border: 0; }
  .net.off { color: var(--rd); background: rgba(248,113,113,.12); }
  .stats { display: grid; grid-template-columns: 1.4fr 1fr; gap: 8px; padding: 6px 16px 0; }
  .stat { background: var(--sf); border: 1px solid var(--bd); border-radius: 18px; padding: 12px 14px; }
  .stat small { color: var(--mu); font-size: 12px; }
  .stat b { display: block; font-size: 24px; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .queue { margin: 8px 16px 0; padding: 9px 12px; border-radius: 12px; background: rgba(245,162,75,.12); color: var(--or); font-size: 13px; font-weight: 700; display: flex; gap: 8px; align-items: center; }
  .zone { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 18px 20px 14px; text-align: center; position: relative; min-height: 270px; }
  .fare { font-size: 15px; color: var(--mu); }
  .fare b { color: var(--tx); font-size: 26px; }
  .reader { width: 160px; height: 160px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--gr); cursor: pointer; position: relative; background: radial-gradient(circle, #0c3a2e 0%, var(--bg) 72%); border: 2px solid rgba(52,211,153,.6); margin-top: 16px; }
  .reader::before, .reader::after { content: ""; position: absolute; inset: -14px; border-radius: 50%; border: 2px solid rgba(52,211,153,.3); animation: pulse 2.2s infinite; }
  .reader::after { animation-delay: 1.1s; }
  @keyframes pulse { from { transform: scale(.92); opacity: 1; } to { transform: scale(1.2); opacity: 0; } }
  .offline .reader { border-color: rgba(245,162,75,.7); color: var(--or); background: radial-gradient(circle, #3a2a0c 0%, var(--bg) 72%); }
  .reader.idle { opacity: .35; }
  .reader.idle::before, .reader.idle::after { display: none; }
  .hint { margin-top: 18px; font-size: 17px; font-weight: 800; }
  .amount { font-size: 40px; font-weight: 900; font-variant-numeric: tabular-nums; }
  .amount small { font-size: 16px; color: var(--mu); }
  .taxi-pad { width: 100%; margin-top: 12px; }
  .taxi-pad .keypad button { height: 52px; font-size: 21px; }
  .result { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; animation: pop .15s ease-out; cursor: pointer; z-index: 5; }
  @keyframes pop { from { opacity: 0; transform: scale(.98); } to { opacity: 1; transform: none; } }
  .result.accepted { background: #0f5132; } .result.already { background: #7a4a12; } .result.rejected { background: #7f1d1d; } .result.pending { background: var(--bg); }
  .result .big { width: 96px; height: 96px; border-radius: 50%; background: rgba(255,255,255,.14); display: flex; align-items: center; justify-content: center; color: #fff; }
  .result .msg { font-size: 23px; font-weight: 900; margin-top: 16px; color: #fff; }
  .result .det { margin-top: 8px; color: rgba(255,255,255,.85); font-size: 14px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .result .tag { background: rgba(0,0,0,.22); border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 700; }
  .panel { padding: 12px 16px 16px; border-top: 1px solid var(--bd); }
  .h4 { margin: 0 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--mu); font-weight: 800; display: flex; justify-content: space-between; }
  .media { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 4px; }
  .media::-webkit-scrollbar { display: none; }
  .med { flex: none; display: flex; align-items: center; gap: 8px; border: 1px solid var(--bd); background: var(--sf); color: var(--tx); border-radius: 14px; padding: 9px 12px; font-size: 13.5px; font-weight: 700; }
  .med.sel { border-color: var(--gr); background: rgba(52,211,153,.08); }
  .med.bad { color: var(--rd); }
  .tx { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--bd); font-size: 13.5px; }
  .tx:last-child { border-bottom: 0; }
  .tx .s { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex: none; }
  .tx .s.accepted { background: rgba(52,211,153,.16); color: var(--gr); } .tx .s.rejected { background: rgba(248,113,113,.16); color: var(--rd); } .tx .s.already_validated { background: rgba(245,162,75,.16); color: var(--or); }
  .tx .grow { flex: 1; min-width: 0; }
  .tx .when { color: var(--mu); font-size: 12px; font-variant-numeric: tabular-nums; }
  .end { margin: 4px 16px 16px; border: 1px solid rgba(248,113,113,.4); background: transparent; color: var(--rd); border-radius: 999px; padding: 13px; font-weight: 800; }
  .sheet { position: absolute; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: flex-end; z-index: 10; }
  .sheet-card { background: var(--bg); width: 100%; border-radius: 26px 26px 0 0; padding: 22px 18px; border-top: 1px solid var(--bd); }
  .sum { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 14px 0; }
  .btn-main { width: 100%; border: 0; border-radius: 999px; padding: 15px; font-weight: 800; font-size: 16px; background: #fff; color: #0a3a2e; }
</style>
</head>
<body>
<div class="term" id="term">
  <div class="strip" id="banner">Simulateur · cartes et téléphones virtuels</div>

  <section id="login" class="login">
    <div class="brand"><span class="m">M</span>METALA SCAN</div>
    <div id="login-step"></div>
  </section>

  <section id="run" class="hidden" style="display:flex;flex-direction:column;flex:1">
    <div class="top">
      <span class="chipl" id="t-chip"></span>
      <div class="grow"><b id="t-veh"></b><small id="t-driver"></small></div>
      <button class="net" id="net"></button>
    </div>
    <div class="stats">
      <div class="stat"><small>Recette du service</small><b id="s-rev">0 FCFA</b></div>
      <div class="stat"><small>Passagers</small><b id="s-pax">0</b></div>
    </div>
    <div class="queue hidden" id="queue"></div>
    <div class="zone" id="zone"></div>
    <div class="panel">
      <div class="h4"><span>Présenté par le voyageur</span><span>simulation</span></div>
      <div class="media" id="media"></div>
      <div class="h4" style="margin-top:14px"><span>Dernières transactions</span></div>
      <div id="recent"></div>
    </div>
    <button class="end" id="end">Fin de service</button>
  </section>
  <div id="sheet" class="sheet hidden"><div class="sheet-card" id="sheet-card"></div></div>
</div>
<script type="module" src="scan.js"></script>
</body>
</html>
