<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#071a20">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Metala Scan</title>
<link rel="stylesheet" href="/shared/metala.css">
<link rel="stylesheet" href="scan.css">
<script src="/vendor/jsqr-1.4.0/jsQR.js"></script>
</head>
<body>
<div class="term" id="term">
  <section id="login" class="login"></section>

  <section id="run" class="run hidden">
    <header class="top">
      <span class="chipl" id="t-chip"></span>
      <div class="grow"><b id="t-veh"></b><small id="t-driver"></small></div>
      <button class="net" id="net"></button>
    </header>
    <div class="queue hidden" id="queue"></div>
    <main class="tabview" id="tabview"></main>
    <nav class="tabs">
      <button data-t="pay" class="on"><span id="ti-pay"></span>Encaisser</button>
      <button data-t="resa"><span id="ti-resa"></span>Réservations<i class="dot hidden" id="resa-dot"></i></button>
      <button data-t="takings"><span id="ti-takings"></span>Recette</button>
    </nav>
  </section>

  <div id="result" class="result hidden"></div>
  <div id="camera" class="camera hidden">
    <video id="video" playsinline muted></video>
    <canvas id="canvas" class="hidden"></canvas>
    <div class="frame"><i></i><i></i><i></i><i></i></div>
    <p class="cam-hint">Visez le QR code affiché dans Metala App</p>
    <button class="cam-close" id="cam-close">Annuler</button>
  </div>
  <div id="sheet" class="sheet hidden"><div class="sheet-card" id="sheet-card"></div></div>
</div>
<script type="module" src="scan.js"></script>
</body>
</html>
