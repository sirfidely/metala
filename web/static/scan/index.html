<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#071a20">
<title>Metala Scan</title>
<link rel="stylesheet" href="/shared/metala.css">
<style>
  :root { --bg: #071a20; --sf: #0f2a33; --sf2: #163742; --bd: rgba(255,255,255,.08); --tx: #e9f3f1; --mu: #86a5a2; --gr: #34d399; --or: #f5a24b; --rd: #f87171; }
  body { background: #04110f; color: var(--tx); }
  body.embed { background: var(--bg); }
  .term { max-width: 460px; margin: 0 auto; min-height: 100dvh; background: var(--bg); display: flex; flex-direction: column; }
  @media (min-width: 600px) { body:not(.embed) { padding: 24px 0; } body:not(.embed) .term { min-height: calc(100dvh - 48px); border-radius: 28px; box-shadow: 0 20px 60px rgba(0,0,0,.5); overflow: hidden; } }
  .strip { font-size: 11px; text-align: center; padding: 4px; background: #2e1065; color: #ddd6fe; }
  .ic { display: block; flex: none; }
  .top { display: flex; align-items: center; gap: 12px; padding: 14px 16px; }
  .top .chipl { min-width: 46px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 900; color: #fff; }
  .top .grow { flex: 1; min-width: 0; }
  .top .grow b { display: block; font-size: 16px; }
  .top .grow small { color: var(--mu); font-size: 12.5px; }
  .pills { display: flex; gap: 6px; padding: 0 16px 6px; flex-wrap: wrap; }
  .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; padding: 6px 10px; border-radius: 999px; background: var(--sf); color: var(--mu); }
  .pill.on { color: var(--gr); }
  .pill.off { color: var(--rd); background: rgba(248,113,113,.12); }
  .pill.q { color: var(--or); background: rgba(245,162,75,.12); }
  .icon-btn { width: 40px; height: 40px; border-radius: 12px; border: 0; background: var(--sf); color: var(--tx); display: flex; align-items: center; justify-content: center; }
  .zone { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 22px 20px 20px; text-align: center; position: relative; min-height: 290px; }
  .reader { width: 168px; height: 168px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--gr); cursor: pointer; position: relative; background: radial-gradient(circle, #0c3a2e 0%, var(--bg) 72%); border: 2px solid rgba(52,211,153,.6); }
  .reader:active { transform: scale(.97); }
  .reader::before, .reader::after { content: ""; position: absolute; inset: -14px; border-radius: 50%; border: 2px solid rgba(52,211,153,.3); animation: pulse 2.2s infinite; }
  .reader::after { animation-delay: 1.1s; }
  @keyframes pulse { from { transform: scale(.92); opacity: 1; } to { transform: scale(1.2); opacity: 0; } }
  .offline .reader { border-color: rgba(245,162,75,.7); color: var(--or); background: radial-gradient(circle, #3a2a0c 0%, var(--bg) 72%); }
  .offline .reader::before, .offline .reader::after { border-color: rgba(245,162,75,.3); }
  .hint { margin-top: 26px; font-size: 19px; font-weight: 800; }
  .result { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; animation: pop .15s ease-out; cursor: pointer; border-radius: 0; }
  @keyframes pop { from { opacity: 0; transform: scale(.98); } to { opacity: 1; transform: none; } }
  .result.accepted { background: #0f5132; }
  .result.already { background: #7a4a12; }
  .result.rejected { background: #7f1d1d; }
  .result.pending { background: var(--bg); }
  .result .big { width: 96px; height: 96px; border-radius: 50%; background: rgba(255,255,255,.14); display: flex; align-items: center; justify-content: center; color: #fff; }
  .result .msg { font-size: 23px; font-weight: 900; margin-top: 16px; color: #fff; }
  .result .det { margin-top: 8px; color: rgba(255,255,255,.85); font-size: 14px; display: flex; gap: 8px; align-items: center; justify-content: center; flex-wrap: wrap; }
  .result .tag { background: rgba(0,0,0,.22); border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 700; }
  .result .lat { margin-top: 14px; font-size: 12px; color: rgba(255,255,255,.7); font-family: ui-monospace, monospace; }
  .panel { padding: 16px; border-top: 1px solid var(--bd); }
  .h4 { margin: 0 0 10px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--mu); font-weight: 800; }
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .vcard { display: flex; align-items: center; gap: 10px; text-align: left; border: 1px solid var(--bd); background: var(--sf); color: var(--tx); border-radius: 16px; padding: 10px; font-size: 14px; font-weight: 700; }
  .vcard .av { width: 34px; height: 34px; border-radius: 50%; background: var(--sf2); display: flex; align-items: center; justify-content: center; font-weight: 900; flex: none; }
  .vcard small { display: block; color: var(--mu); font-weight: 500; font-size: 12px; margin-top: 1px; }
  .vcard.sel { border-color: var(--gr); background: rgba(52,211,153,.08); }
  .vcard.bad .av { background: rgba(248,113,113,.18); color: var(--rd); }
  .checks { display: grid; gap: 8px; margin-bottom: 18px; }
  .chk { display: flex; gap: 10px; align-items: center; font-size: 13.5px; }
  .chk .s { width: 22px; height: 22px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center; }
  .chk.ok .s { background: rgba(52,211,153,.18); color: var(--gr); }
  .chk.ko .s { background: rgba(248,113,113,.18); color: var(--rd); }
  .chk.warn .s { background: rgba(245,162,75,.18); color: var(--or); }
  .chk.skip { opacity: .3; }
  .chk.skip .s { background: var(--sf); }
  .net { display: flex; align-items: center; gap: 12px; margin-top: 14px; background: var(--sf); border: 1px solid var(--bd); border-radius: 16px; padding: 12px 14px; cursor: pointer; }
  .net .grow { flex: 1; font-weight: 700; font-size: 14px; }
  .toggle { width: 50px; height: 30px; border-radius: 999px; background: var(--gr); position: relative; flex: none; transition: background .2s; }
  .toggle::after { content: ""; position: absolute; top: 4px; left: 24px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: left .2s; }
  .toggle.off { background: rgba(255,255,255,.18); }
  .toggle.off::after { left: 4px; }
  details.more summary { cursor: pointer; color: var(--mu); font-size: 12px; margin-top: 14px; }
  .tg { display: flex; align-items: center; gap: 10px; font-size: 13px; margin-top: 10px; }
  .log { max-height: 150px; overflow-y: auto; font-size: 12px; font-family: ui-monospace, monospace; margin-top: 8px; }
  .log div { padding: 4px 0; border-bottom: 1px solid var(--bd); display: flex; gap: 8px; }
  .log .s-accepted { color: var(--gr); } .log .s-already { color: var(--or); } .log .s-rejected { color: var(--rd); }
  .setup { padding: 20px 16px; }
  .setup h2 { margin: 8px 0 16px; }
  .dev-list { display: grid; gap: 8px; }
  .dev-btn { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 16px; border: 1px solid var(--bd); background: var(--sf); color: var(--tx); text-align: left; }
  .dev-btn small { color: var(--mu); }
</style>
</head>
<body>
<div class="term" id="term">
  <div class="strip" id="banner">Simulateur de valideur · cartes virtuelles</div>

  <section id="setup" class="setup">
    <span class="pill">METALA SCAN</span>
    <h2>Choisir le bus</h2>
    <div id="devices" class="dev-list"></div>
  </section>

  <section id="run" class="hidden" style="display:flex;flex-direction:column;flex:1">
    <div class="top">
      <span class="chipl" id="t-chip">—</span>
      <div class="grow"><b id="t-veh">—</b><small id="t-op">—</small></div>
      <button class="icon-btn" id="change" aria-label="Changer de bus"></button>
    </div>
    <div class="pills"><span class="pill on" id="p-net"></span><span class="pill" id="p-fare"></span><span class="pill q hidden" id="p-queue"></span></div>
    <div class="zone">
      <div class="reader" id="reader" role="button" aria-label="Présenter la carte"></div>
      <div class="hint">Présentez votre Metala Pass</div>
      <div id="result" class="result hidden"></div>
    </div>
    <div class="panel">
      <div id="explain-wrap" class="hidden"><div class="h4">Contrôles</div><div class="checks" id="checks"></div></div>
      <div class="h4">Carte présentée</div>
      <div class="cards" id="cards"></div>
      <div class="net" id="net"><span id="net-ic"></span><span class="grow" id="net-label">Réseau 4G</span><span class="toggle" id="net-tg"></span></div>
      <details class="more"><summary>Technique</summary>
        <label class="tg"><input type="checkbox" id="retry"> Rejouer le même passage</label>
        <div class="log" id="log"></div>
      </details>
    </div>
  </section>
</div>
<script type="module" src="scan.js"></script>
</body>
</html>
