<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a2530">
<title>Metala</title>
<link rel="stylesheet" href="/shared/metala.css">
<style>
  body { background: #0a2530; color: #eaf4f2; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
  .wrap { width: min(440px, 100%); }
  .mark { width: 64px; height: 64px; border-radius: 20px; background: linear-gradient(140deg, #34d399, #0e7c66); color: #06231b; font-weight: 900; font-size: 34px; display: flex; align-items: center; justify-content: center; }
  h1 { margin: 16px 0 4px; letter-spacing: .2em; font-size: 26px; }
  p { color: #8fadab; margin: 0 0 24px; }
  a.app { display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: 20px; background: #113442; border: 1px solid rgba(255,255,255,.08); color: inherit; text-decoration: none; margin-bottom: 10px; }
  a.app b { display: block; font-size: 17px; }
  a.app small { color: #8fadab; }
  a.app span.i { width: 46px; height: 46px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 22px; flex: none; }
  a.app::after { content: "›"; margin-left: auto; color: #8fadab; font-size: 22px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="mark">M</div>
  <h1>METALA</h1>
  <p>Votre ville. Votre mobilité.</p>
  <a class="app" href="/app/"><span class="i" style="background:#0e7c66">📱</span><span><b>Metala App</b><small>Voyageurs · trajets, réservation, Metala Pass</small></span></a>
  <a class="app" href="/scan/"><span class="i" style="background:#f5a24b">📟</span><span><b>Metala Scan</b><small>Agents transporteurs · encaissement, réservations, recette</small></span></a>
  <a class="app" href="/fleet/"><span class="i" style="background:#c2410c">🖥️</span><span><b>Metala Gestion</b><small>Compagnies · flotte, lignes, conducteurs, tarifs</small></span></a>
</div>
</body>
</html>
